name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: gofmt -l cmd internal pkg
      - run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: CGO_ENABLED=0 go build -o nimbus-one ./cmd/nimbus-one
      - run: ./nimbus-one selftest
      - run: ./nimbus-one version

  min:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nimbus-min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -timeout 60s ./...
      - run: CGO_ENABLED=0 go build -o nimbus-min .
      - run: ./nimbus-min version
